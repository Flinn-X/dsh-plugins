name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild the palettes client and fail on drift
        run: python packages/palettes/build_client.py && git diff --exit-code packages/palettes/client.js
      - name: Client harness
        run: node packages/palettes/test_client.cjs
      - name: Manifest and resource checks
        run: node scripts/check-packages.mjs
